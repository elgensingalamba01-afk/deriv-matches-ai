<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Deriv Over/Under Live Scanner</title>
<style>
*{margin,#:0;padding:0;box-sizing:border6-box}
body{font-family:systemc-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#0b0f1a;color:#e8edf5;padding:16px;min-height:100vh}
.container{max-width:1400px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;padding-bottom:16px;border-bottom:1px solid #1e2a44}
.logo h1{font-size:22px;background:linear-gradient(135deg,#00d4ff5ce7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo .sub{font-size:12px;color:#7b8eae;-webkit-text-fill-color:#7b8eae}
.status-badge{display:flex;align-items:center;gap:8px;background:#141f33;padding:6px 16px;border-radius:30px;border:1px solid #1e2a44;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;animation:pulse 1.8s infinite}
.dot.green{background:#00f593;box-shadow:0 0 12px #00f59366}
.dot.yellow{background:#fbbf24;box-shadow:0 0 12px #fbbf2466}
.dot.red{background:#f87171;box-shadow:0 0 12px #f8717166}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0}
.stat-card{background:#111d33;padding:14px 12px;border-radius:14px;border:1px solid #1a2a4a;text-align:center}
.stat-card .num{font-size:24px;font-weight:700;color:#00d4ff}
.stat-card .num.green{color:#00f593}
.stat-card .num.gold{color:#fbbf24}
.stat-card .lbl{font-size:10px;color:#7b8eae;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.controls{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0 16px;align-items:center}
.controls select{padding:10px 16px;background:#111d33;border:1px solid #1a2a4a;border-radius:10px;color:#e8edf5;font-size:14px;flex:1 1 160px;min-width:120px}
.controls select:focus{outline:none;border-color:#00d4ff;box-shadow:0 0 0 3px #00d4ff22}
.btn{padding:10px 28px;border:none;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,#00d4ff,#6c5ce7);color:#fff}
.btn-primary:hover{transform:scale(1.02);box-shadow:0 0 24px #6c5ce766}
.btn-secondary{background:#1e2a44;color:#b0c0d0}
.btn-secondary:hover{border-color:#00d4ff;color:#e8edf5}
.table-wrapper{background:#111d33;border-radius:14px;border:1px solid #1a2a4a;overflow:hidden;margin-top:10px}
.table-header{padding:12px 18px;border-bottom:1px solid #1a2a4a;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
.table-header h3{font-size:13px;color:#7b8eae;text-transform:uppercase;letter-spacing:.5px}
.table-header .count{font-size:13px;color:#7b8eae}
.table-header .count span{color:#00d4ff;font-weight:600}
.table-scroll{overflow-x:auto;padding:0 4px 4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;color:#7b8eae;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid #1a2a4a;position:sticky;top:0;background:#111d33}
td{padding:8px 12px;border-bottom:1px solid #0d1a2a;vertical-align:middle}
tr:hover td{background:#0d1a2e}
tr:last-child td{border-bottom:none}
.symbol-name{font-weight:600}
.symbol-name .sub{color:#7b8eae;font-weight:400;font-size:11px}
.score-bar{display:flex;align-items:center;gap:8px}
.score-track{width:70px;height:6px;background:#0b0f1a;border-radius:4px;overflow:hidden}
.score-fill{height:100%;border-radius:4px;transition:width .4s ease}
.score-fill.high{background:#00f593}
.score-fill.med{background:#fbbf24}
.score-fill.low{background:#f87171}
.badge{padding:2px 12px;border-radius:12px;font-size:11px;font-weight:700;display:inline-block}
.badge.over{background:#00d4ff33;color:#00d4ff}
.badge.under{background:#fbbf2433;color:#fbbf24}
.recommendation{padding:3px 12px;border-radius:20px;font-size:11px;font-weight:700;display:inline-block}
.recommendation.strong{background:#00f59333;color:#00f593}
.recommendation.buy{background:#00d4ff33;color:#00d4ff}
.recommendation.neutral{background:#7b8eae33;color:#b0c0d0}
.loading{display:none;text-align:center;padding:30px}
.loading.active{display:block}
.spinner{width:30px;height:30px;border:3px solid #1a2a4a;border-top-color:#00d4ff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:720px){.header{flex-direction:column;align-items:stretch}.controls{flex-direction:column}.controls select,.controls .btn{width:100%}.stats-grid{grid-template-columns:repeat(2,1fr)}th,td{padding:5px 8px;font-size:11px}.score-track{width:50px}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="logo"><h1>📊 Over/Under Live Scanner</h1><div class="sub">Real Deriv WebSocket · Live tick data · No API token</div></div>
<div class="status-badge"><span class="dot yellow" id="statusDot"></span><span id="statusText">CONNECTING…</span></div>
</div>
<div class="stats-grid">
<div class="stat-card"><div class="num" id="totalMarkets">0</div><div class="lbl">Markets</div></div>
<div class="stat-card"><div class="num green" id="overCount">0</div><div class="lbl">📈 Over</div></div>
<div class="stat-card"><div class="num gold" id="underCount">0</div><div class="lbl">📉 Under</div></div>
<div class="stat-card"><div class="num" id="bestMarket">—</div><div class="lbl">🏆 Best</div></div>
<div class="stat-card"><div class="num gold" id="topScore">0%</div><div class="lbl">Top Score</div></div>
</div>
<div class="controls">
<select id="symbolFilter">
<option value="all">🌐 All Markets</option>
<option value="volatility">📈 Volatility</option>
<option value="otc">🔷 OTC</option>
<option value="crash">📉 Crash</option>
<option value="boom">🚀 Boom</option>
</select>
<select id="historySelect">
<option value="50">Last 50 ticks</option>
<option value="100">Last 100</option>
<option value="200">Last 200</option>
<option value="500" selected>Last 500</option>
</select>
<button class="btn btn-primary" onclick="scanAll()">🔍 SCAN ALL</button>
<button class="btn btn-secondary" onclick="toggleAuto()">⏸️ Auto</button>
</div>
<div class="loading" id="loading"><div class="spinner"></div><div style="color:#7b8eae;">Connecting to Deriv WebSocket…</div></div>
<div class="table-wrapper">
<div class="table-header"><h3>📈 Over / Under Signals</h3><div class="count">Showing <span id="resultCount">0</span> markets</div></div>
<div class="table-scroll">
<table>
<thead><tr><th>Market</th><th>Price</th><th>Over</th><th>Under</th><th>Best</th><th>Signal</th><th>Trade</th></tr></thead>
<tbody id="tableBody"><tr><td colspan="7" style="text-align:center;padding:40px;color:#7b8eae;"><div style="font-size:32px;margin-bottom:8px;">📡</div>Click <strong style="color:#00d4ff;">"SCAN ALL"</strong> to fetch live data</td></tr></tbody>
</table>
</div>
</div>
</div>

<script>
// ================================================================
//  REAL DERIV WEBSOCKET — CONNECTS TO LIVE MARKETS
// ================================================================

const WS_URL = 'wss://ws.derivws.com/websockets/v3?app_id=1089';
let ws = null;
let isConnected = false;
let isScanning = false;
let autoMode = true;
let autoTimer = null;
let symbolCache = {};
let activeSymbols = [];
let results = [];
let reqId = 1;
let pendingRequests = {};

const $ = id => document.getElementById(id);
const statusDot = $('statusDot');
const statusText = $('statusText');
const tableBody = $('tableBody');
const loading = $('loading');
const totalMarkets = $('totalMarkets');
const overCount = $('overCount');
const underCount = $('underCount');
const bestMarket = $('bestMarket');
const topScore = $('topScore');
const resultCount = $('resultCount');

// ----------------------------------------------------------------
//  WEBSOCKET CONNECTION
// ----------------------------------------------------------------
function connectWebSocket() {
    if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
    statusText.textContent = 'CONNECTING…';
    statusDot.className = 'dot yellow';
    loading.classList.add('active');

    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
        isConnected = true;
        statusText.textContent = 'LIVE · CONNECTED';
        statusDot.className = 'dot green';
        loading.classList.remove('active');
        console.log('🔌 Connected to Deriv WebSocket');

        // Request active symbols (no auth needed)
        const id = reqId++;
        pendingRequests[id] = 'active_symbols';
        ws.send(JSON.stringify({
            active_symbols: 'brief',
            product_type: 'basic',
            req_id: id
        }));
    };

    ws.onmessage = (ev) => {
        try {
            const data = JSON.parse(ev.data);
            handleMessage(data);
        } catch (e) {
            console.warn('Parse error:', e);
        }
    };

    ws.onerror = () => {
        statusText.textContent = '⚠️ ERROR';
        statusDot.className = 'dot red';
        loading.classList.remove('active');
    };

    ws.onclose = () => {
        isConnected = false;
        statusText.textContent = '⚠️ DISCONNECTED';
        statusDot.className = 'dot red';
        console.warn('Reconnecting in 3s…');
        setTimeout(connectWebSocket, 3000);
    };
}

// ----------------------------------------------------------------
//  MESSAGE HANDLER
// ----------------------------------------------------------------
function handleMessage(data) {
    // Active symbols response
    if (data.msg_type === 'active_symbols' && data.active_symbols) {
        activeSymbols = data.active_symbols
            .filter(s => s.market_display_name && s.symbol)
            .map(s => ({
                symbol: s.symbol,
                name: s.display_name || s.symbol,
                market: s.market_display_name || s.market || ''
            }));
        console.log(`📋 ${activeSymbols.length} active symbols loaded`);

        // Pre-warm cache
        activeSymbols.forEach(s => {
            if (!symbolCache[s.symbol]) {
                symbolCache[s.symbol] = { ticks: [], name: s.name, market: s.market };
            }
        });

        if (autoMode) setTimeout(() => scanAll(), 800);
        return;
    }

    // Tick history response
    if (data.msg_type === 'history' && data.history) {
        const id = data.req_id;
        if (pendingRequests[id]) {
            const sym = pendingRequests[id];
            delete pendingRequests[id];
            if (data.history.prices && data.history.times) {
                const ticks = data.history.prices.map((price, i) => ({
                    epoch: data.history.times[i],
                    quote: price
                }));
                if (!symbolCache[sym]) symbolCache[sym] = { ticks: [], name: sym, market: '' };
                symbolCache[sym].ticks = ticks;
            }
        }
        return;
    }

    // Live tick update
    if (data.msg_type === 'tick' && data.tick) {
        const sym = data.tick.symbol;
        if (!symbolCache[sym]) symbolCache[sym] = { ticks: [], name: sym, market: '' };
        symbolCache[sym].ticks.push({
            epoch: data.tick.epoch || Date.now(),
            quote: data.tick.quote
        });
        if (symbolCache[sym].ticks.length > 2000) {
            symbolCache[sym].ticks = symbolCache[sym].ticks.slice(-1000);
        }
        return;
    }

    if (data.error) {
        console.warn('API error:', data.error);
    }
}

// ----------------------------------------------------------------
//  FETCH TICKS VIA WEBSOCKET (WITH PROMISE)
// ----------------------------------------------------------------
function fetchTicks(symbol, count = 500) {
    return new Promise((resolve) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            resolve([]);
            return;
        }

        const id = reqId++;
        pendingRequests[id] = symbol;

        ws.send(JSON.stringify({
            ticks_history: symbol,
            end: 'latest',
            count: count,
            style: 'ticks',
            req_id: id
        }));

        // Timeout after 5 seconds
        setTimeout(() => {
            if (pendingRequests[id]) {
                delete pendingRequests[id];
                resolve([]);
            }
        }, 5000);
    });
}

// ----------------------------------------------------------------
//  ANALYSIS ENGINE
// ----------------------------------------------------------------
function analyzeMarket(symbol, name, market, ticks) {
    if (!ticks || ticks.length < 20) return null;

    const digits = ticks.map(t => {
        const str = t.quote.toFixed(4).replace('.', '');
        return parseInt(str.slice(-1));
    });

    const total = digits.length;
    const overCount = digits.filter(d => d >= 5).length;
    const underCount = digits.filter(d => d < 5).length;

    const overScore = (overCount / total) * 100;
    const underScore = (underCount / total) * 100;

    const bestType = overScore > underScore ? 'OVER' : 'UNDER';
    const bestScore = Math.max(overScore, underScore);
    const confidence = Math.min(98, Math.round((bestScore - 50) * 2.2 + 50));

    let recommendation = 'NEUTRAL';
    if (bestScore > 66) recommendation = 'STRONG ' + bestType;
    else if (bestScore > 57) recommendation = bestType;

    return {
        symbol, name, market,
        currentPrice: ticks[ticks.length - 1]?.quote || 0,
        overScore: parseFloat(overScore.toFixed(1)),
        underScore: parseFloat(underScore.toFixed(1)),
        bestType,
        bestScore: parseFloat(bestScore.toFixed(1)),
        recommendation,
        confidence,
        tradeSuggestion: `Trade ${bestType} 5 on ${symbol}`,
        tickCount: total
    };
}

// ----------------------------------------------------------------
//  SCAN ALL MARKETS
// ----------------------------------------------------------------
async function scanAll() {
    if (isScanning || !isConnected) return;
    isScanning = true;

    loading.classList.add('active');
    statusText.textContent = 'SCANNING…';
    statusDot.className = 'dot yellow';

    let symbols = activeSymbols.length > 0 ? activeSymbols : getFallbackSymbols();
    const filter = $('symbolFilter').value;
    if (filter !== 'all') {
        const map = {
            volatility: s => s.market && s.market.toLowerCase().includes('volatility'),
            otc: s => s.market && s.market.toLowerCase().includes('otc'),
            crash: s => s.symbol && s.symbol.toUpperCase().includes('CRASH'),
            boom: s => s.symbol && s.symbol.toUpperCase().includes('BOOM')
        };
        symbols = symbols.filter(s => map[filter] ? map[filter](s) : true);
    }

    const maxMarkets = 25;
    if (symbols.length > maxMarkets) symbols = symbols.slice(0, maxMarkets);

    const historyCount = parseInt($('historySelect').value);
    const scanned = [];

    for (const sym of symbols) {
        let ticks = symbolCache[sym.symbol]?.ticks || [];
        if (ticks.length < historyCount) {
            const fetched = await fetchTicks(sym.symbol, historyCount);
            if (fetched.length > 0) {
                ticks = fetched;
            }
        }
        if (ticks.length < 20) continue;

        const analysis = analyzeMarket(sym.symbol, sym.name || sym.symbol, sym.market || '', ticks.slice(-historyCount));
        if (analysis) scanned.push(analysis);
        await new Promise(r => setTimeout(r, 100));
    }

    scanned.sort((a, b) => b.bestScore - a.bestScore);
    results = scanned;

    const overs = results.filter(r => r.bestType === 'OVER' && r.bestScore > 55).length;
    const unders = results.filter(r => r.bestType === 'UNDER' && r.bestScore > 55).length;

    totalMarkets.textContent = results.length;
    overCount.textContent = overs;
    underCount.textContent = unders;

    if (results.length > 0) {
        bestMarket.textContent = results[0].symbol;
        bestMarket.style.color = '#00f593';
        topScore.textContent = results[0].bestScore + '%';
    }

    renderTable(results);
    statusText.textContent = `LIVE · ${results.length} markets`;
    statusDot.className = 'dot green';
    loading.classList.remove('active');
    isScanning = false;
}

// ----------------------------------------------------------------
//  RENDER TABLE
// ----------------------------------------------------------------
function renderTable(data) {
    if (!data || data.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:#7b8eae;">No data. Try "SCAN ALL" again.</td></tr>';
        resultCount.textContent = '0';
        return;
    }

    let html = '';
    data.forEach((r, i) => {
        const overClass = r.overScore >= 55 ? 'high' : r.overScore >= 45 ? 'med' : 'low';
        const underClass = r.underScore >= 55 ? 'high' : r.underScore >= 45 ? 'med' : 'low';
        let recClass = 'neutral';
        if (r.recommendation.startsWith('STRONG')) recClass = 'strong';
        else if (r.recommendation === 'OVER' || r.recommendation === 'UNDER') recClass = 'buy';
        const isBest = i === 0 && r.bestScore > 60;

        html += `<tr>
            <td><div class="symbol-name">${r.symbol} <span class="sub">${r.name}</span>${isBest ? ' ⭐' : ''}</div><div style="font-size:10px;color:#7b8eae;">${r.market}</div></td>
            <td>$${r.currentPrice.toFixed(4)}</td>
            <td><div class="score-bar"><div class="score-track"><div class="score-fill ${overClass}" style="width:${r.overScore}%"></div></div><span style="font-size:11px;font-weight:600;color:#00d4ff;">${r.overScore}%</span></div></td>
            <td><div class="score-bar"><div class="score-track"><div class="score-fill ${underClass}" style="width:${r.underScore}%"></div></div><span style="font-size:11px;font-weight:600;color:#fbbf24;">${r.underScore}%</span></div></td>
            <td style="font-weight:700;color:${r.bestType === 'OVER' ? '#00d4ff' : '#fbbf24'};">${r.bestType} ${r.bestScore}%</td>
            <td><span class="recommendation ${recClass}">${r.recommendation}</span><div style="font-size:10px;color:#7b8eae;margin-top:2px;">conf ${r.confidence}%</div></td>
            <td><div style="font-size:12px;font-weight:600;color:#00d4ff;">${r.tradeSuggestion}</div><div style="font-size:10px;color:#7b8eae;">${r.tickCount} ticks</div></td>
        </tr>`;
    });
    tableBody.innerHTML = html;
    resultCount.textContent = data.length;
}

// ----------------------------------------------------------------
//  AUTO SCAN
// ----------------------------------------------------------------
function toggleAuto() {
    autoMode = !autoMode;
    const btn = document.querySelector('.btn-secondary');
    if (autoMode) { btn.textContent = '⏸️ Auto'; startAuto(); }
    else { btn.textContent = '▶️ Auto'; stopAuto(); }
}
function startAuto() {
    stopAuto();
    autoTimer = setInterval(() => { if (!isScanning && isConnected) scanAll(); }, 8000);
}
function stopAuto() {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
}

// ----------------------------------------------------------------
//  FALLBACK SYMBOLS
// ----------------------------------------------------------------
function getFallbackSymbols() {
    return [
        { symbol: 'R_10', name: 'Volatility 10', market: 'Volatility' },
        { symbol: 'R_25', name: 'Volatility 25', market: 'Volatility' },
        { symbol: 'R_50', name: 'Volatility 50', market: 'Volatility' },
        { symbol: 'R_75', name: 'Volatility 75', market: 'Volatility' },
        { symbol: 'R_100', name: 'Volatility 100', market: 'Volatility' },
        { symbol: '1HZ10V', name: 'Volatility 10 (1s)', market: 'Volatility' },
        { symbol: '1HZ25V', name: 'Volatility 25 (1s)', market: 'Volatility' },
        { symbol: '1HZ50V', name: 'Volatility 50 (1s)', market: 'Volatility' },
        { symbol: '1HZ75V', name: 'Volatility 75 (1s)', market: 'Volatility' },
        { symbol: '1HZ100V', name: 'Volatility 100 (1s)', market: 'Volatility' },
        { symbol: 'R_10_OTC', name: 'OTC Volatility 10', market: 'OTC' },
        { symbol: 'R_25_OTC', name: 'OTC Volatility 25', market: 'OTC' },
        { symbol: 'R_50_OTC', name: 'OTC Volatility 50', market: 'OTC' },
        { symbol: 'R_75_OTC', name: 'OTC Volatility 75', market: 'OTC' },
        { symbol: 'R_100_OTC', name: 'OTC Volatility 100', market: 'OTC' },
        { symbol: '1HZ10V_OTC', name: 'OTC Volatility 10 (1s)', market: 'OTC' },
        { symbol: '1HZ25V_OTC', name: 'OTC Volatility 25 (1s)', market: 'OTC' },
        { symbol: '1HZ50V_OTC', name: 'OTC Volatility 50 (1s)', market: 'OTC' },
        { symbol: '1HZ75V_OTC', name: 'OTC Volatility 75 (1s)', market: 'OTC' },
        { symbol: '1HZ100V_OTC', name: 'OTC Volatility 100 (1s)', market: 'OTC' },
        { symbol: 'CRASH', name: 'Crash', market: 'Crash' },
        { symbol: 'BOOM', name: 'Boom', market: 'Boom' }
    ];
}

// ----------------------------------------------------------------
//  INIT
// ----------------------------------------------------------------
function init() {
    connectWebSocket();
    setTimeout(() => { if (autoMode && isConnected) startAuto(); }, 3000);
    console.log('📊 Over/Under Live Scanner initialized');
}

window.scanAll = scanAll;
window.toggleAuto = toggleAuto;
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
